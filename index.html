<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4a7c0" />
    <meta
      name="description"
      content="You're invited to Luhan Amari's 1st Birthday — December 30, 2026. Kindly RSVP."
    />

    <!-- Link preview (Messenger, Viber, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="You're invited to Luhan Amari's 1st Birthday 🍬" />
    <meta
      property="og:description"
      content="A sweet candy fairytale celebration on December 30, 2026. Tap to open your invitation and RSVP."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Luhan Amari's Candy Fairytale Land | A Sweet First Birthday</title>

    <!--
      Loading screen styles are inlined so the loader paints instantly,
      even on slow connections before the app bundle has downloaded.
    -->
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        text-align: center;
        font-family:
          'Quicksand',
          system-ui,
          -apple-system,
          sans-serif;
        color: #a8325e;
        background:
          radial-gradient(circle at 50% 40%, #fff 0%, transparent 60%),
          linear-gradient(180deg, #fde4ec 0%, #f3e3f7 55%, #e4f0fa 100%);
        transition:
          opacity 0.6s ease,
          visibility 0.6s ease;
      }
      #app-loader.is-done {
        opacity: 0;
        visibility: hidden;
      }
      .loader__stage {
        position: relative;
        width: 130px;
        height: 130px;
      }
      .loader__ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px dotted #cbb6df;
        animation: loader-spin 6s linear infinite;
      }
      .loader__candy {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 74px;
        margin: -30px 0 0 -37px;
        animation: loader-bounce 1s cubic-bezier(0.3, 0, 0.3, 1) infinite alternate;
      }
      .loader__shadow {
        position: absolute;
        left: 50%;
        bottom: 18px;
        width: 50px;
        height: 8px;
        margin-left: -25px;
        border-radius: 50%;
        background: rgba(168, 50, 94, 0.18);
        animation: loader-shadow 1s cubic-bezier(0.3, 0, 0.3, 1) infinite alternate;
      }
      .loader__star {
        position: absolute;
        width: 14px;
        height: 14px;
        background: #c6addc;
        clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
        animation: loader-twinkle 1.4s ease-in-out infinite;
      }
      .loader__star:nth-of-type(1) {
        top: 4px;
        left: 8px;
      }
      .loader__star:nth-of-type(2) {
        top: 14px;
        right: 0;
        animation-delay: 0.45s;
      }
      .loader__star:nth-of-type(3) {
        bottom: 6px;
        left: 0;
        animation-delay: 0.9s;
      }
      .loader__title {
        margin: 0;
        font-family: 'Great Vibes', cursive;
        font-size: 2.3rem;
        line-height: 1.1;
        font-weight: 400;
      }
      .loader__text {
        margin: 0;
        min-height: 1.4em;
        font-size: 0.9rem;
        font-weight: 600;
        color: #8a6b7c;
      }
      .loader__dots span {
        display: inline-block;
        animation: loader-dot 1.2s ease-in-out infinite;
      }
      .loader__dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .loader__dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      .loader__bar {
        width: min(70vw, 220px);
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.8);
        box-shadow: inset 0 0 0 1px rgba(190, 159, 200, 0.4);
      }
      .loader__bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #f4a7c0, #d4537e, #b597e0);
        animation: loader-progress 1.4s ease-in-out infinite;
      }
      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes loader-bounce {
        from {
          transform: translateY(6px) rotate(-6deg);
        }
        to {
          transform: translateY(-16px) rotate(6deg);
        }
      }
      @keyframes loader-shadow {
        from {
          transform: scaleX(1);
          opacity: 1;
        }
        to {
          transform: scaleX(0.6);
          opacity: 0.5;
        }
      }
      @keyframes loader-twinkle {
        0%,
        100% {
          opacity: 0.2;
          transform: scale(0.5);
        }
        50% {
          opacity: 1;
          transform: scale(1.1) rotate(45deg);
        }
      }
      @keyframes loader-dot {
        0%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        50% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }
      @keyframes loader-progress {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader * {
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loader" role="status" aria-live="polite">
      <div class="loader__stage" aria-hidden="true">
        <span class="loader__ring"></span>
        <span class="loader__star"></span>
        <span class="loader__star"></span>
        <span class="loader__star"></span>
        <svg class="loader__candy" viewBox="0 0 80 52" aria-hidden="true">
          <path
            d="m25 18-17-6 3 14-3 14 17-6m30-16 17-6-3 14 3 14-17-6"
            fill="#d7c6eb"
            stroke="#baa4ce"
            stroke-width="1.5"
          />
          <rect
            x="22"
            y="10"
            width="36"
            height="32"
            rx="14"
            fill="#fff8f0"
            stroke="#e8b5ce"
            stroke-width="2"
          />
          <path d="m26 15 25 22m-16-25 21 19m-33-7 18 17" stroke="#efbdd3" stroke-width="6" />
        </svg>
        <span class="loader__shadow"></span>
      </div>
      <p class="loader__title">Luhan Amari</p>
      <p class="loader__text">
        <span id="loader-message">Swirling the candy clouds</span>
        <span class="loader__dots"><span>.</span><span>.</span><span>.</span></span>
      </p>
      <div class="loader__bar" aria-hidden="true"><span></span></div>
    </div>

    <script>
      // Rotate playful messages while the invitation loads.
      ;(function () {
        var messages = [
          'Swirling the candy clouds',
          'Following the pastel rainbow',
          'Sprinkling pixie dust',
          'Inflating the birthday balloons',
          'Baking the cupcake cottages',
          'Your sweet adventure awaits',
        ]
        var index = 0
        var el = document.getElementById('loader-message')
        window.__loaderTimer = window.setInterval(function () {
          index = (index + 1) % messages.length
          if (el) el.textContent = messages[index]
        }, 1600)
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
