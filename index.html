<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4a7c0" />
    <meta name="description" content="You're invited to Princess Luhan Marie's 1st Birthday — December 30, 2026. Kindly RSVP." />

    <!-- Link preview (Messenger, Viber, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="You're invited to Luhan Marie's 1st Birthday 👑" />
    <meta property="og:description" content="A royal princess celebration on December 30, 2026. Tap to open your invitation and RSVP." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Luhan Marie's 1st Birthday | Royal Invitation</title>

    <!--
      Loading screen styles are inlined so the loader paints instantly,
      even on slow connections before the app bundle has downloaded.
    -->
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        text-align: center;
        font-family: 'Quicksand', system-ui, -apple-system, sans-serif;
        color: #a8325e;
        background:
          radial-gradient(circle at 50% 40%, #fff 0%, transparent 60%),
          linear-gradient(180deg, #fde4ec 0%, #f3e3f7 55%, #e4f0fa 100%);
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #app-loader.is-done {
        opacity: 0;
        visibility: hidden;
      }
      .loader__stage {
        position: relative;
        width: 130px;
        height: 130px;
      }
      .loader__ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px dotted #c9a24b;
        animation: loader-spin 6s linear infinite;
      }
      .loader__crown {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 74px;
        margin: -30px 0 0 -37px;
        animation: loader-bounce 1s cubic-bezier(0.3, 0, 0.3, 1) infinite alternate;
      }
      .loader__shadow {
        position: absolute;
        left: 50%;
        bottom: 18px;
        width: 50px;
        height: 8px;
        margin-left: -25px;
        border-radius: 50%;
        background: rgba(168, 50, 94, 0.18);
        animation: loader-shadow 1s cubic-bezier(0.3, 0, 0.3, 1) infinite alternate;
      }
      .loader__star {
        position: absolute;
        width: 14px;
        height: 14px;
        background: #d8b25a;
        clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
        animation: loader-twinkle 1.4s ease-in-out infinite;
      }
      .loader__star:nth-of-type(1) { top: 4px; left: 8px; }
      .loader__star:nth-of-type(2) { top: 14px; right: 0; animation-delay: 0.45s; }
      .loader__star:nth-of-type(3) { bottom: 6px; left: 0; animation-delay: 0.9s; }
      .loader__title {
        margin: 0;
        font-family: 'Great Vibes', cursive;
        font-size: 2.3rem;
        line-height: 1.1;
        font-weight: 400;
      }
      .loader__text {
        margin: 0;
        min-height: 1.4em;
        font-size: 0.9rem;
        font-weight: 600;
        color: #8a6b7c;
      }
      .loader__dots span {
        display: inline-block;
        animation: loader-dot 1.2s ease-in-out infinite;
      }
      .loader__dots span:nth-child(2) { animation-delay: 0.2s; }
      .loader__dots span:nth-child(3) { animation-delay: 0.4s; }
      .loader__bar {
        width: min(70vw, 220px);
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.8);
        box-shadow: inset 0 0 0 1px rgba(201, 162, 75, 0.4);
      }
      .loader__bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #f4a7c0, #d4537e, #b597e0);
        animation: loader-progress 1.4s ease-in-out infinite;
      }
      @keyframes loader-spin { to { transform: rotate(360deg); } }
      @keyframes loader-bounce {
        from { transform: translateY(6px) rotate(-6deg); }
        to { transform: translateY(-16px) rotate(6deg); }
      }
      @keyframes loader-shadow {
        from { transform: scaleX(1); opacity: 1; }
        to { transform: scaleX(0.6); opacity: 0.5; }
      }
      @keyframes loader-twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.5); }
        50% { opacity: 1; transform: scale(1.1) rotate(45deg); }
      }
      @keyframes loader-dot {
        0%, 100% { transform: translateY(0); opacity: 0.4; }
        50% { transform: translateY(-4px); opacity: 1; }
      }
      @keyframes loader-progress {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader * { animation-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="app-loader" role="status" aria-live="polite">
      <div class="loader__stage" aria-hidden="true">
        <span class="loader__ring"></span>
        <span class="loader__star"></span>
        <span class="loader__star"></span>
        <span class="loader__star"></span>
        <svg class="loader__crown" viewBox="0 0 64 44">
          <defs>
            <linearGradient id="loader-gold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f6e3a1" />
              <stop offset="0.55" stop-color="#d8b25a" />
              <stop offset="1" stop-color="#b8892f" />
            </linearGradient>
          </defs>
          <path d="M4 14l14 12L32 5l14 21 14-12-6 23H10Z" fill="url(#loader-gold)" stroke="#a87a26" stroke-width="1.2" stroke-linejoin="round" />
          <rect x="9" y="37" width="46" height="5" rx="2" fill="url(#loader-gold)" stroke="#a87a26" stroke-width="1.2" />
          <circle cx="4" cy="13" r="3" fill="#f4a7c0" />
          <circle cx="32" cy="4.5" r="3.2" fill="#f4a7c0" />
          <circle cx="60" cy="13" r="3" fill="#f4a7c0" />
          <circle cx="32" cy="27" r="3.4" fill="#d4537e" />
        </svg>
        <span class="loader__shadow"></span>
      </div>
      <p class="loader__title">Luhan Marie</p>
      <p class="loader__text">
        <span id="loader-message">Polishing the royal crown</span>
        <span class="loader__dots"><span>.</span><span>.</span><span>.</span></span>
      </p>
      <div class="loader__bar" aria-hidden="true"><span></span></div>
    </div>

    <script>
      // Rotate playful messages while the invitation loads.
      ;(function () {
        var messages = [
          'Polishing the royal crown',
          'Waking up the fairy godmother',
          'Sprinkling pixie dust',
          'Inflating the birthday balloons',
          'Baking the royal cake',
          'Almost ready, Your Highness',
        ]
        var index = 0
        var el = document.getElementById('loader-message')
        window.__loaderTimer = window.setInterval(function () {
          index = (index + 1) % messages.length
          if (el) el.textContent = messages[index]
        }, 1600)
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
